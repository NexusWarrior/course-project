server {
    listen 8080;
    client_max_body_size 16k;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    location ~ ^/tasks(/|$) {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    location / {
        return 404;
    }
}
