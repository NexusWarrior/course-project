version: '3.8'

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks_user
      POSTGRES_PASSWORD_FILE: /run/secrets/tasks_db_password
    secrets:
      - tasks_db_password
    configs:
      - source: tasks_schema
        target: /docker-entrypoint-initdb.d/01-init.sql
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "tasks_user", "-d", "tasks"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      placement:
        constraints:
          - node.labels.tasks_db == true

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tasks
      DB_USER: tasks_user
      DB_PASSWORD_FILE: /run/secrets/tasks_db_password
    secrets:
      - tasks_db_password
    networks:
      - application
      - database
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 6s
      start_period: 35s
      retries: 3
    deploy:
      replicas: 3
      placement:
        preferences:
          - spread: node.hostname
      update_config:
        parallelism: 1
        order: start-first
        monitor: 50s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first

  gateway:
    image: nginx:stable-alpine
    configs:
      - source: tasks_gateway
        target: /etc/nginx/conf.d/default.conf
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - application

networks:
  application:
    driver: overlay
  database:
    driver: overlay
    internal: true

volumes:
  postgres_data:

secrets:
  tasks_db_password:
    external: true

configs:
  tasks_schema:
    file: ../db/init.sql
  tasks_gateway:
    file: ./nginx.conf
